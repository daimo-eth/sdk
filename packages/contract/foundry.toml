[profile.default]
src = 'src'
out = 'out'
libs = ['lib']
fs_permissions = [{ access = "read", path = "./"}]

# Compiler settings
solc = "0.8.26"
via_ir = true
optimizer = true
optimizer_runs = 999_999
evm_version = "london"

# DepositAddressManager must deploy on Tempo (chainId 4217), which has a lower
# block gas limit. It is compiled at a lower optimizer_runs so it fits. This MUST be
# uniform across all chains in order to compute the same fulfillment addresses
# across chains.
name = "da-manager-low-opt"
via_ir = true
optimizer = true
optimizer_runs = 200
evm_version = "london"

[[profile.default.compilation_restrictions]]
paths = "src/DepositAddressManager.sol"
optimizer_runs = 200

# See more config options https://github.com/foundry-rs/foundry/tree/master/config